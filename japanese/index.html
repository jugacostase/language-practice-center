<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3557">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kanji SRS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Kanji SRS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<!-- The kanji font is picked in Settings; this link is swapped by applyFont(). -->
<link id="jpfont" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Palette: #e63946 red · #f1faee mint white · #a8dadc powder blue · #457b9d steel blue · #1d3557 navy */
:root{
  --jp:"Klee One","Noto Sans JP",sans-serif; --jpw:600;
  --bg:#f1faee; --panel:#ffffff; --ink:#1d3557; --muted:#56698a; --line:#cfe3e2;
  --accent:#e63946; --primary:#1d3557; --on-primary:#f1faee;
  --new:#457b9d; --learn:#e63946; --due:#1d3557;
  --again:#e63946; --hard:#56698a; --good:#457b9d; --easy:#1d3557;
  --tile-new:#eef6f2; --tile-learn:#fbd7da; --tile-young:#d3ecec; --tile-mature:#a8dadc;
  --scrim:rgba(29,53,87,.45);
  --shadow:0 1px 2px rgba(29,53,87,.06),0 4px 16px rgba(29,53,87,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#13243c; --panel:#1d3557; --ink:#f1faee; --muted:#9fb6c9; --line:#2d4b72;
    --accent:#f47a83; --primary:#a8dadc; --on-primary:#1d3557;
    --new:#a8dadc; --learn:#f47a83; --due:#f1faee;
    --again:#f47a83; --hard:#9fb6c9; --good:#a8dadc; --easy:#f1faee;
    --tile-new:#24406a; --tile-learn:#5c2a3c; --tile-young:#2d5a72; --tile-mature:#457b9d;
    --scrim:rgba(8,16,30,.6);
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,-apple-system,Segoe UI,sans-serif;}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.01em}
header h1 span{color:var(--accent);font-family:var(--jp)}
nav{margin-left:auto;display:flex;gap:4px}
nav button{background:none;border:1px solid transparent;border-radius:8px;padding:6px 10px;color:var(--muted)}
nav button.on{border-color:var(--line);background:var(--panel);color:var(--ink)}
.sync{font-size:12px;color:var(--muted);margin-left:8px;white-space:nowrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:22px}
.stat small{color:var(--muted);font-size:12px}
.decks{display:flex;flex-direction:column;gap:8px}
.deck{display:flex;align-items:center;gap:12px;padding:14px 16px}
.deck .name{font-weight:600}
.deck .desc{font-size:13px;color:var(--muted)}
.counts{margin-left:auto;display:flex;gap:12px;font-variant-numeric:tabular-nums;font-weight:600}
.c-new{color:var(--new)} .c-learn{color:var(--learn)} .c-due{color:var(--due)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.big{display:block;width:100%;padding:14px;font-size:17px;margin:16px 0}
.hint{color:var(--muted);font-size:13px}
/* study */
.studybar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.card{min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 20px;position:relative}
.tag{position:absolute;top:12px;left:14px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.speak{position:absolute;top:8px;right:10px;border:none;background:none;font-size:18px;color:var(--muted);padding:6px}
.kanji-big{font-family:var(--jp);font-size:128px;line-height:1.1;font-weight:var(--jpw)}
.word-big{font-family:var(--jp);font-size:64px;line-height:1.2;font-weight:var(--jpw)}
.prompt{font-size:30px;font-weight:600}
.sub{color:var(--muted);margin-top:8px}
.jp-hint{font-family:'Noto Sans JP',sans-serif;font-size:17px;color:var(--text)}
.ctable input{width:100%;box-sizing:border-box;font:inherit;padding:4px 6px}
hr.div{width:100%;border:none;border-top:1px dashed var(--line);margin:20px 0}
.meaning{font-size:26px;font-weight:600}
.reading{font-size:28px;font-family:"Noto Sans JP",sans-serif}
.readings{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:12px;text-align:left;font-size:17px}
.readings dt{color:var(--muted);font-size:13px;padding-top:3px}
.readings dd{margin:0}
.examples{margin-top:16px;width:100%;max-width:440px;text-align:left}
.ex{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);font-size:16px}
.ex:last-child{border-bottom:none}
.ex .w{font-family:var(--jp);font-size:20px;min-width:96px}
.ex .r{color:var(--muted);min-width:110px}
.ex .lock{font-size:11px;color:var(--muted);margin-left:auto}
.breakdown{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.bk{border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
button.bk{background:var(--panel);color:var(--ink);font-family:inherit;line-height:1.3;max-width:11em;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.bk:active{background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.bk span{font-family:var(--jp);font-size:22px;display:block}
.bk .bkm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
/* the kanji of the card just graded, under the result note: small enough to fit above the keyboard */
.flashks{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.flashks .bk{display:flex;align-items:center;gap:6px;padding:4px 10px;min-height:40px;max-width:12em}
.flashks .bk span{font-size:20px;display:inline}
.answer{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.answer button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 4px;font-weight:600}
.answer button small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.answer .a{color:var(--again)} .answer .h{color:var(--hard)} .answer .g{color:var(--good)} .answer .e{color:var(--easy)}
.kbd{font-size:11px;color:var(--muted)}
.ask{margin-top:12px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.ask label{grid-column:1/-1;font-weight:700;font-size:15px}
.ask label span{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.ask input{font:inherit;font-size:22px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);text-align:center;min-width:0}
.ask.reading input{border-color:var(--new)} .ask.meaning input{border-color:var(--accent)}
.ask .btn{height:100%;padding:0 18px;font-size:16px}
.ask .warn{grid-column:1/-1;color:var(--again);font-size:13px;min-height:16px}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:13px;padding:0}
.ask .linkbtn{grid-column:1/-1;justify-self:center}
.results{display:flex;flex-direction:column;gap:6px;margin-top:16px;width:100%;max-width:440px}
.res{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:8px 12px;border-radius:10px;font-size:16px;text-align:left}
.res.ok{background:color-mix(in srgb,var(--good) 14%,transparent)} .res.bad{background:color-mix(in srgb,var(--again) 14%,transparent)}
.res .qk{font-size:12px;color:var(--muted);min-width:56px;text-transform:uppercase;letter-spacing:.06em}
.res .given{font-weight:600} .res.ok .mark{color:var(--good)} .res.bad .mark{color:var(--again)}
.res .exp{color:var(--muted);font-size:14px;margin-left:auto}
/* answer card shown after a wrong answer, WaniKani style */
.fbcard{width:100%;max-width:440px;margin:14px auto 0;border:2px solid var(--again);border-radius:14px;background:var(--panel);text-align:left;overflow:hidden}
.fbcard .fbhead{background:#e63946;color:#fff;padding:8px 14px;font-weight:700;display:flex;gap:8px;align-items:baseline}
.fbcard .fbhead .given{font-weight:400;opacity:.9;margin-left:auto;font-size:14px}
.fbcard .fbhead .given b{font-weight:600}
.fbcard .fbbody{padding:12px 14px}
.fbsec{padding:8px 10px;border-radius:10px}
.fbsec + .fbsec{margin-top:6px}
.fbsec.miss{background:color-mix(in srgb,var(--again) 10%,transparent)}
.fbsec h3{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.fbsec .main{font-size:22px;font-weight:600}
.fbsec .alt{color:var(--muted);font-size:14px;margin-top:2px}
.fbsec .rd{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.fbsec .rd dt{color:var(--muted);font-size:13px}
.fbsec .rd dd{margin:0;font-family:"Noto Sans JP",sans-serif;font-size:22px}
.fbsec .rd dd.none{font-size:15px;color:var(--muted)}
.fbcard .breakdown{justify-content:flex-start;margin-top:8px}
/* Result of the card just graded: shown at the bottom of the next card, right above the
   answer box, so it stays visible when the phone keyboard pushes the page up. */
.flash{text-align:center;font-size:14px;font-weight:600;padding:6px 12px;border-radius:10px;margin:16px auto 0;width:fit-content;animation:flashfade 2.4s ease forwards}
/* While typing, the card shrinks to its content so the card, the result and the answer box fit above the keyboard. */
.card.asking{min-height:0;padding:30px 20px 16px}
.flash.ok{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)} .flash.bad{color:var(--again);background:color-mix(in srgb,var(--again) 14%,transparent)}
@keyframes flashfade{0%,80%{opacity:1}100%{opacity:.35}}
.answer button.sug{outline:2px solid currentColor;outline-offset:-2px}

.done{text-align:center;padding:48px 16px}
.done .kanji-big{font-size:72px}
/* browse */
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin:8px 0 12px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px}
.tile{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--jp);font-size:28px;background:var(--tile-new)}
.tile.learn{background:var(--tile-learn)} .tile.young{background:var(--tile-young)} .tile.mature{background:var(--tile-mature)}
.modal-bg{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom));z-index:10}
.modal{max-width:520px;width:100%;max-height:90vh;max-height:calc(100dvh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative;text-align:center}
.modal .kanji-big{font-size:96px}
.modal .alt{color:var(--muted);font-size:14px;margin-top:2px}
.modal h3{margin:16px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:left}
.modal .examples{margin-top:4px}
.modal .close{position:absolute;top:8px;right:8px;border:none;background:none;font-size:20px;color:var(--muted)}
.cardstats{font-size:12px;color:var(--muted);margin-top:12px}
/* settings */
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row label{flex:1}
.row input[type=number]{width:72px;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{width:100%;min-height:120px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:ui-monospace,monospace;font-size:12px;padding:8px}
h2{font-size:15px;margin:20px 0 8px}
.msg{font-size:13px;color:var(--muted);min-height:18px;margin-top:6px}
.wrap{padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(48px,env(safe-area-inset-bottom))}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;margin-bottom:12px;border-color:var(--learn)}
.banner .t{flex:1;min-width:200px;font-size:14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.snaps{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.snaps .snap{display:flex;align-items:center;gap:8px;font-size:13px}
.snaps .snap span{flex:1}
code{font-size:12px}
select{font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.clist .desc{font-variant-numeric:tabular-nums}
.row input[type=text],.row input:not([type]){font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea.cl-text{font-family:"Noto Sans JP",system-ui,sans-serif;font-size:15px;min-height:160px;line-height:1.6}
.preview{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.ctable{width:100%;border-collapse:collapse;font-size:14px}
.ctable th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:4px 6px}
.ctable td{padding:5px 6px;border-top:1px solid var(--line);vertical-align:top}
.ctable .jw{font-family:var(--jp);font-size:19px;white-space:nowrap}
.warnc{color:var(--again);font-size:13px}
.fontpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}
.fontpick button{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 6px;text-align:center}
.fontpick button.on{border-color:var(--primary)}
.fontpick .s{display:block;font-size:34px;line-height:1.3}
.fontpick small{color:var(--muted);font-size:12px}
@media (max-width:560px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .kanji-big{font-size:104px}
  .word-big{font-size:48px}
  .deck{flex-wrap:wrap}
  nav button{padding:6px 8px}
  .sync{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span>漢字</span> SRS</h1>
    <span class="sync" id="sync">Saved on this device</span>
    <nav>
      <button data-view="home" class="on">Decks</button>
      <button data-view="class">Class</button>
      <button data-view="browse">Browse</button>
      <button data-view="settings">Settings</button>
    </nav>
  </header>
  <main id="main"></main>
</div>
<div id="modal-root"></div>

<script>
/* ============================== DATA ==============================
   kanji | meaning | on'yomi | kun'yomi | examples (word:reading:meaning;...)
   Ordered for learning: numbers → calendar → people → body/nature → position → adjectives → verbs → places.
*/
const KANJI_RAW = `
一|one|イチ、イツ|ひと、ひと(つ)|一つ:ひとつ:one (thing);一人:ひとり:one person; alone;一月:いちがつ:January
二|two|ニ|ふた、ふた(つ)|二つ:ふたつ:two (things);二人:ふたり:two people;二月:にがつ:February
三|three|サン|み、みっ(つ)|三つ:みっつ:three (things);三月:さんがつ:March;三人:さんにん:three people
四|four|シ|よ、よん、よっ(つ)|四つ:よっつ:four (things);四月:しがつ:April;四人:よにん:four people
五|five|ゴ|いつ、いつ(つ)|五つ:いつつ:five (things);五月:ごがつ:May
六|six|ロク|むっ(つ)|六つ:むっつ:six (things);六月:ろくがつ:June
七|seven|シチ|なな、なな(つ)|七つ:ななつ:seven (things);七月:しちがつ:July
八|eight|ハチ|やっ(つ)|八つ:やっつ:eight (things);八月:はちがつ:August
九|nine|キュウ、ク|ここの(つ)|九つ:ここのつ:nine (things);九月:くがつ:September
十|ten|ジュウ、ジッ|とお|十:とお:ten (things);十月:じゅうがつ:October
百|hundred|ヒャク||百円:ひゃくえん:100 yen;三百:さんびゃく:three hundred
千|thousand|セン|ち|千円:せんえん:1,000 yen;三千:さんぜん:three thousand
万|ten thousand|マン、バン||一万円:いちまんえん:10,000 yen
円|yen; circle|エン|まる(い)|円:えん:yen;百円:ひゃくえん:100 yen
日|day; sun|ニチ、ジツ|ひ、か|日曜日:にちようび:Sunday;毎日:まいにち:every day;今日:きょう:today
月|month; moon|ゲツ、ガツ|つき|月曜日:げつようび:Monday;一月:いちがつ:January;毎月:まいつき:every month
火|fire|カ|ひ|火曜日:かようび:Tuesday;火:ひ:fire;花火:はなび:fireworks
水|water|スイ|みず|水:みず:water;水曜日:すいようび:Wednesday
木|tree; wood|モク、ボク|き|木:き:tree;木曜日:もくようび:Thursday
金|gold; money|キン、コン|かね|お金:おかね:money;金曜日:きんようび:Friday
土|earth, soil|ド、ト|つち|土曜日:どようび:Saturday;土:つち:soil
年|year|ネン|とし|今年:ことし:this year;毎年:まいとし:every year;来年:らいねん:next year
時|time; hour|ジ|とき|時間:じかん:time; hours;一時:いちじ:one o'clock;何時:なんじ:what time
分|minute; part; understand|ブン、フン、ブ|わ(かる)、わ(ける)|分かる:わかる:to understand;五分:ごふん:five minutes;半分:はんぶん:half
半|half|ハン|なか(ば)|半分:はんぶん:half;三時半:さんじはん:half past three
今|now|コン、キン|いま|今:いま:now;今日:きょう:today;今週:こんしゅう:this week
週|week|シュウ||今週:こんしゅう:this week;毎週:まいしゅう:every week;来週:らいしゅう:next week
毎|every|マイ||毎日:まいにち:every day;毎週:まいしゅう:every week;毎月:まいつき:every month
人|person|ジン、ニン|ひと|人:ひと:person;日本人:にほんじん:Japanese person;三人:さんにん:three people
男|man|ダン、ナン|おとこ|男:おとこ:man;男の子:おとこのこ:boy;男性:だんせい:male
女|woman|ジョ、ニョ|おんな|女:おんな:woman;女の子:おんなのこ:girl;彼女:かのじょ:she; girlfriend
子|child|シ、ス|こ|子供:こども:child;女の子:おんなのこ:girl;男の子:おとこのこ:boy
父|father|フ|ちち|父:ちち:(my) father;お父さん:おとうさん:father
母|mother|ボ|はは|母:はは:(my) mother;お母さん:おかあさん:mother
友|friend|ユウ|とも|友達:ともだち:friend;友人:ゆうじん:friend
私|I; private|シ|わたし|私:わたし:I, me;私立:しりつ:private (institution)
名|name|メイ、ミョウ|な|名前:なまえ:name;有名:ゆうめい:famous
先|previous; ahead|セン|さき|先生:せんせい:teacher;先週:せんしゅう:last week;先月:せんげつ:last month
生|life; birth|セイ、ショウ|い(きる)、う(まれる)|学生:がくせい:student;先生:せんせい:teacher;生まれる:うまれる:to be born
学|study, learning|ガク|まな(ぶ)|学生:がくせい:student;学校:がっこう:school;大学:だいがく:university
校|school|コウ||学校:がっこう:school;高校:こうこう:high school
語|language; word|ゴ|かた(る)|日本語:にほんご:Japanese language;英語:えいご:English;単語:たんご:word, vocabulary

const KANJI = [], KMAP = {}, WORDS = [], WMAP = {}, CLASS = [], CMAP = {};
// Built-in list first, then content stored in the database's `items` table (e.g. imported
// from WaniKani), in its own order. An imported item the app already has only adds
// extra accepted answers. Rebuilt whenever the database is (re)loaded.
function buildContent(rows = []) {
  KANJI.length = 0; WORDS.length = 0;
  for (const k in KMAP) delete KMAP[k];
  for (const k in WMAP) delete WMAP[k];
  CLASS.length = 0; for (const k in CMAP) delete CMAP[k];
  KANJI_RAW.trim().split("\n").forEach((line, i) => {
    const [k, meaning, on, kun, ex] = line.split("|");
    // Example separator is ";" not followed by a space ("; " separates senses inside a meaning).
    const examples = (ex || "").split(/;(?! )/).filter(Boolean).map(s => {
      const [w, r, m] = s.split(":"); return { w, r, m };
    });
    const item = { k, meaning, on, kun, examples, idx: i, src: "core" };
    KANJI.push(item); KMAP[k] = item;
  });
  const extra = rows.map(r => { let d = {}; try { d = JSON.parse(r.data_json); } catch (e) {} return { ...r, d }; })
    .sort((a, b) => a.sort - b.sort);
  const addAccept = (it, d) => {
    if (d.acceptM && d.acceptM.length) it.acceptM = [...new Set([...(it.acceptM || []), ...d.acceptM])];
    if (d.acceptR && d.acceptR.length) it.acceptR = [...new Set([...(it.acceptR || []), ...d.acceptR])];
  };
  for (const r of extra) if (r.kind === "kanji") {
    if (KMAP[r.item]) { addAccept(KMAP[r.item], r.d); continue; }
    const item = { k: r.item, meaning: r.d.meaning || "", on: r.d.on || "", kun: r.d.kun || "", examples: [], idx: KANJI.length, src: r.source, level: r.d.level };
    addAccept(item, r.d); KANJI.push(item); KMAP[r.item] = item;
  }
  // Words: deduplicated across kanji. A word unlocks once every kanji in it that
  // this app teaches has been introduced (seen at least once).
  const addWord = (w, r, m, src) => {
    const ks = [...new Set([...w].filter(c => KMAP[c]))];
    if (!ks.length) return null;
    const order = Math.max(...ks.map(c => KMAP[c].idx));
    const word = { w, r, m, ks, order, n: WORDS.length, src };
    WORDS.push(word); WMAP[w] = word; return word;
  };
  KANJI.forEach(kj => kj.examples.forEach(e => { if (!WMAP[e.w]) addWord(e.w, e.r, e.m, "core"); }));
  for (const r of extra) if (r.kind === "word") {
    if (WMAP[r.item]) { addAccept(WMAP[r.item], r.d); continue; }
    const word = addWord(r.item, r.d.r || "", r.d.m || "", r.source);
    if (word) { word.level = r.d.level; addAccept(word, r.d); }
  }
  WORDS.sort((a, b) => a.order - b.order || a.n - b.n);
  // Class words: their own deck, in the order they were pasted. Not tied to kanji unlocks.
  for (const r of extra) if (r.kind === "class" && !CMAP[r.item]) {
    const w = { w: r.item, r: r.d.r || (WMAP[r.item] ? WMAP[r.item].r : ""), m: r.d.m || "", list: r.d.list || "Class words", ks: [...new Set([...r.item].filter(c => KMAP[c]))], sort: r.sort };
    CLASS.push(w); CMAP[w.w] = w;
  }
  // Imported kanji show up to three words that use them.
  for (const k of KANJI) if (k.src !== "core")
    k.examples = WORDS.filter(w => w.ks.includes(k.k)).slice(0, 3).map(w => ({ w: w.w, r: w.r, m: w.m }));
}
buildContent();

// Each deck has its own one-letter prefix for card ids. Meaning and reading of a kanji are
// separate cards (k: and y:) with their own schedules, like WaniKani's separate questions.
const DECKS = [
  { id: "kanji", letter: "k", name: "Kanji meaning", desc: "See the kanji, give its meaning", def: 10 },
  { id: "readings", letter: "y", name: "Kanji reading", desc: "See the kanji, give a reading. Unlocks once you've met the kanji", def: 10 },
  { id: "words", letter: "w", name: "Words · meaning", desc: "Vocabulary that unlocks as you learn its kanji", def: 15 },
  { id: "wordread", letter: "v", name: "Words · reading", desc: "See the word, type its reading in kana. Unlocks as you learn its kanji", def: 15 },
  { id: "recall", letter: "r", name: "Kanji writing", desc: "See the meaning, write the kanji by hand, then grade yourself. Unlocks once you've learned the kanji's meaning", def: 5 },
  { id: "class", letter: "c", name: "Class words · meaning", desc: "The vocabulary lists you paste in from your Japanese class", def: 20 },
  { id: "classread", letter: "d", name: "Class words · reading", desc: "Readings of the class words written with kanji", def: 20 },
  { id: "classwrite", letter: "e", name: "Class words · writing", desc: "See the meaning and reading, write the word in kanji by hand, then grade yourself", def: 10 },
];
const DECK_LETTER = Object.fromEntries(DECKS.map(d => [d.id, d.letter]));
const DECK_BY_LETTER = Object.fromEntries(DECKS.map(d => [d.letter, d.id]));
const cardId = (deck, key) => DECK_LETTER[deck] + ":" + key; // k:日 meaning, y:日 reading, w:毎日, r:日 writing, c:/d:/e: 食べる meaning/reading/writing
// Cards about the same kanji (or the same word) are "siblings" and are never shown back to back.
const CLASS_DECKS = ["class", "classread", "classwrite"];
const isClassDeck = deck => CLASS_DECKS.includes(deck);
const isWordDeck = deck => deck === "words" || deck === "wordread" || isClassDeck(deck); // decks about a word, not a single kanji
const sibKey = (deck, key) => (isWordDeck(deck) ? "W:" : "K:") + key;

/* ============================== STATE ============================== */
const LS_KEY = "kanji-srs-v1";
function freshState() {
  return { v: 1, updatedAt: 0, cards: {}, daily: { day: -1, newDone: {}, reviews: 0 }, history: {},
    settings: { newPerDay: Object.fromEntries(DECKS.map(d => [d.id, d.def])), autoSpeak: false, typeMode: true, autoGrade: true, backupEveryDays: 3, jpFont: "klee" } };
}
function normalize(s) {
  const f = freshState();
  if (!s || typeof s !== "object") return f;
  return { ...f, ...s, cards: s.cards || {}, daily: { ...f.daily, ...(s.daily || {}) }, history: s.history || {},
    settings: { ...f.settings, ...(s.settings || {}), newPerDay: { ...f.settings.newPerDay, ...((s.settings || {}).newPerDay || {}) } } };
}
let state = freshState();
function readLocalStorageState() { try { const raw = localStorage.getItem(LS_KEY); return raw ? normalize(JSON.parse(raw)) : null; } catch (e) { return null; } }

/* ============================== SCHEDULER (Anki-style SM-2) ============================== */
const MIN = 60e3, DAY = 864e5, ROLLOVER_H = 4;
const LEARN_STEPS = [1, 10], RELEARN_STEPS = [10], GRAD_IVL = 1, EASY_IVL = 4;
const START_EASE = 2.5, MIN_EASE = 1.3, HARD_MULT = 1.2, EASY_BONUS = 1.3, MAX_IVL = 36500;

function dayNum(t) { const off = new Date(t).getTimezoneOffset() * MIN; return Math.floor((t - off - ROLLOVER_H * 3600e3) / DAY); }
function today() { return dayNum(Date.now()); }
function dueAtDay(day) { // a timestamp that falls on `day` (local, after rollover)
  const now = Date.now(); return now + (day - dayNum(now)) * DAY;
}
function getCard(id) { return state.cards[id] || { t: "new", s: 0, due: 0, ivl: 0, e: START_EASE, r: 0, l: 0 }; }
function fuzz(ivl) { if (ivl < 3) return ivl; const f = Math.max(1, Math.round(ivl * 0.05)); return ivl + Math.floor(Math.random() * (2 * f + 1)) - f; }

// grade: 1 again, 2 hard, 3 good, 4 easy. Returns a new card state. `preview` skips fuzz.
function schedule(c, grade, now, preview) {
  c = { ...c }; const td = dayNum(now);
  const graduate = ivl => { ivl = Math.min(MAX_IVL, preview ? ivl : fuzz(ivl)); c.t = "review"; c.s = 0; c.ivl = ivl; c.due = dueAtDay(td + ivl); };
  if (c.t === "new" || c.t === "learn") {
    const st = LEARN_STEPS; const s = c.t === "new" ? 0 : c.s;
    if (grade === 1) { c.t = "learn"; c.s = 0; c.due = now + st[0] * MIN; }
    else if (grade === 2) { c.t = "learn"; c.s = s; const d = (s === 0 && st.length > 1) ? (st[0] + st[1]) / 2 : st[s] * 1.5; c.due = now + d * MIN; }
    else if (grade === 3) { if (s + 1 >= st.length) graduate(GRAD_IVL); else { c.t = "learn"; c.s = s + 1; c.due = now + st[s + 1] * MIN; } }
    else graduate(EASY_IVL);
  } else if (c.t === "relearn") {
    const st = RELEARN_STEPS;
    if (grade === 1) { c.s = 0; c.due = now + st[0] * MIN; }
    else if (grade === 2) { c.due = now + st[c.s] * 1.5 * MIN; }
    else if (grade === 3) { if (c.s + 1 >= st.length) graduate(Math.max(1, c.ivl)); else { c.s++; c.due = now + st[c.s] * MIN; } }
    else graduate(Math.max(1, c.ivl) + 1);
  } else { // review
    const late = Math.max(0, td - dayNum(c.due));
    const ivl = c.ivl || 1;
    const hard = Math.max(ivl + 1, Math.round(ivl * HARD_MULT));
    const good = Math.max(hard + 1, Math.round((ivl + late / 2) * c.e));
    const easy = Math.max(good + 1, Math.round((ivl + late) * c.e * EASY_BONUS));
    if (grade === 1) { c.l = (c.l || 0) + 1; c.e = Math.max(MIN_EASE, c.e - 0.2); c.ivl = 1; c.t = "relearn"; c.s = 0; c.due = now + RELEARN_STEPS[0] * MIN; }
    else if (grade === 2) { c.e = Math.max(MIN_EASE, c.e - 0.15); graduate(hard); }
    else if (grade === 3) { graduate(good); }
    else { c.e = c.e + 0.15; graduate(easy); }
  }
  c.r = (c.r || 0) + 1; c.last = now;

}
function fmtIvl(ms) {
  const m = ms / MIN;
  if (m < 60) return Math.max(1, Math.round(m)) + "m";
  if (m < 1440) return Math.round(m / 60) + "h";
  const d = Math.round(m / 1440);
  if (d < 30) return d + "d";
  if (d < 365) return (d / 30).toFixed(1).replace(".0", "") + "mo";
  return (d / 365).toFixed(1).replace(".0", "") + "y";
}
function previewLabel(c, grade) {
  const now = Date.now(); const n = schedule(c, grade, now, true);
  return n.t === "review" ? fmtIvl(n.ivl * DAY) : fmtIvl(n.due - now);
}

/* ============================== QUEUES ============================== */
function rollDay() {
  const td = today();
  if (state.daily.day !== td) state.daily = { day: td, newDone: {}, reviews: 0 };
}
function introduced(k) { return getCard(cardId("kanji", k)).t !== "new"; }
// A random but stable-for-the-day number per card, used to shuffle: the order changes each
// day but stays put during the day, so counts and the new-card pick don't jump around.
function shuffleKey(id) {
  let h = 2166136261 ^ today();
  for (let i = 0; i < id.length; i++) h = Math.imul(h ^ id.charCodeAt(i), 16777619);
  return (h >>> 0) / 4294967296;
}
let classScope = null; // a class list name to study only that list, or null for every class word
function deckCards(deck) { // ordered list of {id, key} available (unlocked) in this deck
  if (deck === "kanji") return KANJI.map(k => ({ id: cardId("kanji", k.k), key: k.k }));
  if (deck === "readings") return KANJI.filter(k => introduced(k.k)).map(k => ({ id: cardId("readings", k.k), key: k.k }));
  if (isClassDeck(deck)) return CLASS.filter(w => (!classScope || w.list === classScope) && classDeckHas(deck, w)).map(w => ({ id: cardId(deck, w.w), key: w.w }))
    .sort((a, b) => shuffleKey(a.id) - shuffleKey(b.id)); // class words come in a random order, not the pasted one
  if (deck === "words") return WORDS.filter(w => w.ks.every(introduced)).map(w => ({ id: cardId("words", w.w), key: w.w }));
  if (deck === "wordread") return WORDS.filter(w => w.r && w.ks.every(introduced)).map(w => ({ id: cardId("wordread", w.w), key: w.w }));
  // Writing a kanji from its meaning unlocks once the meaning card has graduated from learning.
  if (deck === "recall") return KANJI.filter(k => { const c = getCard(cardId("kanji", k.k)); return c.t === "review" || c.t === "relearn"; })
    .map(k => ({ id: cardId("recall", k.k), key: k.k }));
  return [];
}
function lockedWords() { return WORDS.length - deckCards("words").length; }
function deckCounts(deck) {
  rollDay(); const now = Date.now(), td = today();
  let nw = 0, lr = 0, due = 0;
  const left = Math.max(0, (state.settings.newPerDay[deck] ?? 0) - (state.daily.newDone[deck] || 0));
  for (const { id } of deckCards(deck)) {
    const c = getCard(id);
    if (c.t === "new") nw++;
    else if (c.t === "learn" || c.t === "relearn") { if (c.due <= now + 20 * MIN) lr++; }
    else if (dayNum(c.due) <= td) due++;
  }
  return { nw: Math.min(nw, left), lr, due };
}
let lastShown = null, recentSibs = [];
function pickNext(decks) {
  rollDay(); const now = Date.now(), td = today();
  const learn = [], rev = [], news = [], ahead = []; let nextLearn = Infinity;
  for (const deck of decks) {
    let left = Math.max(0, (state.settings.newPerDay[deck] ?? 0) - (state.daily.newDone[deck] || 0));
    for (const it of deckCards(deck)) {
      const c = getCard(it.id); const item = { ...it, deck, c };
      if (c.t === "new") { if (left > 0) { news.push(item); left--; } }
      else if (c.t === "learn" || c.t === "relearn") {
        if (c.due <= now) learn.push(item); else if (c.due <= now + 20 * MIN) ahead.push(item); else nextLearn = Math.min(nextLearn, c.due);
        nextLearn = Math.min(nextLearn, c.due);
      } else if (dayNum(c.due) <= td) rev.push(item);
    }
  }
  // Skip the card just shown and its siblings (the other cards of the same kanji or word)
  // whenever something else is available, so meaning and reading never come back to back.
  const fresh = it => it.id !== lastShown && !recentSibs.includes(sibKey(it.deck, it.key));
  const avoid = arr => arr.find(fresh) || arr.find(it => it.id !== lastShown) || arr[0];
  learn.sort((a, b) => a.c.due - b.c.due);
  // Reviews: oldest due day first, shuffled within a day (so cards learned together don't come back in the same order).
  rev.sort((a, b) => dayNum(a.c.due) - dayNum(b.c.due) || shuffleKey(a.id) - shuffleKey(b.id));
  // Interleave new cards: kanji first, so their words unlock right after.
  // Class meaning and reading cards count as one group, shuffled together.
  const rank = deck => DECKS.findIndex(d => d.id === (isClassDeck(deck) ? "class" : deck));
  news.sort((a, b) => rank(a.deck) - rank(b.deck) || (isClassDeck(a.deck) ? shuffleKey(a.id) - shuffleKey(b.id) : 0));

  if (learnOk.length) return learnOk[0];
  const pick = mix(rev.filter(fresh), news.filter(fresh));
  if (pick) return pick;
  if (learn.length) return avoid(learn);
  if (rev.length || news.length) return mix(rev, news);

  if (ahead.length) return avoid(ahead);

}

// The database runs in db-worker.js. The in-memory `state` object is the working copy;
// every change is written through to SQLite right away. If SQLite can't start (very old
// browser, or the app is already open in another tab), it falls back to localStorage.
const syncEl = document.getElementById("sync");
function splitId(id) { const [l, ...rest] = id.split(":"); return { deck: DECK_BY_LETTER[l], item: rest.join(":") }; }
function cardToRow(id, c) {
  const { deck, item } = splitId(id);
  return { card_id: id, deck, item, state: c.t, step: c.s || 0, due_ms: c.due || null, interval_days: c.ivl || 0,
    ease: c.e ?? START_EASE, reps: c.r || 0, lapses: c.l || 0, last_review_ms: c.last || null };
}
function rowToCard(r) {
  const c = { t: r.state, s: r.step, due: r.due_ms ?? 0, ivl: r.interval_days, e: r.ease, r: r.reps, l: r.lapses };
  if (r.last_review_ms) c.last = r.last_review_ms;
  return c;
}
const dayDate = d => new Date(d * DAY).toISOString().slice(0, 10); // local calendar date of study day d
// Each deck's new-card count for the day lives in a daily column new_<deck id>.
function dailyRow(d = state.daily) {
  const row = { study_day: d.day, date: dayDate(d.day), reviews: d.reviews || 0 };
  for (const dk of DECKS) row["new_" + dk.id] = d.newDone[dk.id] || 0;
  return row;
}
function stateToRows(st) {
  const days = new Map(Object.entries(st.history || {}).map(([d, n]) => [+d, dailyRow({ day: +d, reviews: n, newDone: {} })]));
  if (st.daily && st.daily.day >= 0) days.set(st.daily.day, dailyRow(st.daily));
  return { cards: Object.entries(st.cards).map(([id, c]) => cardToRow(id, c)), daily: [...days.values()] };
}
function applyRows(data) {
  if (data.items) buildContent(data.items);

  for (const r of data.cards) st.cards[r.card_id] = rowToCard(r);
  for (const r of data.daily) if (r.reviews) st.history[r.study_day] = r.reviews;
  const t = data.daily.find(r => r.study_day === today());
  if (t) st.daily = { day: t.study_day, reviews: t.reviews, newDone: Object.fromEntries(DECKS.map(dk => [dk.id, t["new_" + dk.id] || 0])) };
  for (const sp of SPLITS) st[sp.flag] = !!(data.meta && data.meta[sp.meta]);

}
// One-time splits of an old combined card (meaning + reading on one card) into a meaning
// card (keeps its id and history) and a reading card that starts with a copy of the old
// card's schedule, so no progress is lost. Kanji: k: → k: + y:. Class words: c: → c: + d:.
// Runs after any load that may hold pre-split progress: first start, database import, snapshot restore.
const SPLITS = [
  { flag: "splitDone", meta: "split_readings_ms", from: "k:", to: "y:", what: "kanji", applies: () => true },
  { flag: "splitClassDone", meta: "split_class_ms", from: "c:", to: "d:", what: "class word", applies: key => CMAP[key] && hasReadingCard(CMAP[key]) },
  { flag: "splitWordsDone", meta: "split_words_ms", from: "w:", to: "v:", what: "word", applies: key => WMAP[key] && !!WMAP[key].r },
];
async function splitKanjiCards() {
  let total = 0;
  for (const sp of SPLITS) {
    if (state[sp.flag]) continue;
    const add = [];
    for (const [id, c] of Object.entries(state.cards)) {
      if (!id.startsWith(sp.from) || c.t === "new" || !sp.applies(id.slice(2))) continue;
      const to = sp.to + id.slice(2);
      if (!state.cards[to]) { state.cards[to] = { ...c }; add.push(cardToRow(to, state.cards[to])); }
    }
    state[sp.flag] = true;
    if (dbReady) await dbc.call("splitCards", { cards: add, metaKey: sp.meta });
    else persistLocal();
    if (add.length) { changeSeq++; migratedNote = (migratedNote ? migratedNote + " " : "") + `Meaning and reading are now separate cards: ${add.length} ${sp.what} reading card${add.length === 1 ? " was" : "s were"} created with the progress of their old card.`; }
    total += add.length;
  }

}

const dbc = (() => {
  let w = null, seq = 0; const pending = new Map();
  function fail(err) { for (const p of pending.values()) p.rej(err); pending.clear(); }
  return {
    start() {
      w = new Worker("db-worker.js", { type: "module" });
      w.onmessage = e => { const p = pending.get(e.data.id); if (!p) return; pending.delete(e.data.id); e.data.ok ? p.res(e.data.result) : p.rej(new Error(e.data.error)); };
      w.onerror = e => { e.preventDefault(); fail(new Error(e.message || "The database worker failed to load")); };
    },
    call(op, args, transfer) {
      return new Promise((res, rej) => { const id = ++seq; pending.set(id, { res, rej }); w.postMessage({ id, op, args }, transfer || []); });
    },
  };
})();
const withTimeout = (p, ms, msg) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(msg)), ms))]);

let dbReady = false, dbError = "", sqliteVersion = "", reviewCount = 0, migratedNote = "";
let lastBackupMs = 0, lastBackupHow = "", persisted = null, changeSeq = 0;
function persistLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
function savedLabel() { return dbReady ? "Saved on this device" : "Saved in browser storage"; }
function track(p) {
  changeSeq++; scheduleAutoBackup();
  if (!p) { persistLocal(); return; }
  syncEl.textContent = "Saving…";
  p.then(() => { syncEl.textContent = savedLabel(); })
   .catch(e => { syncEl.textContent = "Couldn't save!"; console.error(e); persistLocal(); });
}
const store = {
  review(x) { reviewCount++; track(dbReady && dbc.call("review", x)); },
  undoReview(x) { reviewCount = Math.max(0, reviewCount - 1); track(dbReady && dbc.call("undoReview", x)); },
  settings() { track(dbReady && dbc.call("settings", state.settings)); },
  replaceState(clearReviews) {
    if (clearReviews) reviewCount = 0;
    track(dbReady && dbc.call("replaceState", { ...stateToRows(state), settings: state.settings, clearReviews }));
  },
};

async function boot() {
  main.innerHTML = `<p class="hint">Opening your database…</p>`;
  try {
    if (!("storage" in navigator) || !navigator.storage.getDirectory) throw new Error("This browser has no private file system (OPFS). iOS 16.4+ or a recent Chrome/Firefox is needed.");
    // Only one tab/window may own the database. Hold a Web Lock for the page's lifetime;
    // a second tab waits here until the first one closes.
    if (navigator.locks) {
      const waitMsg = setTimeout(() => { main.innerHTML = `<div class="panel banner"><div class="t">Kanji SRS is open in another tab or window. Close it and this one will continue.</div></div>`; }, 1500);
      await new Promise(got => navigator.locks.request("kanji-srs-db", () => { got(); return new Promise(() => {}); }));
      clearTimeout(waitMsg); main.innerHTML = `<p class="hint">Opening your database…</p>`;
    }
    dbc.start();
    const info = await withTimeout(dbc.call("init"), 30000, "The database took too long to open. Is the app open in another tab or window?");
    sqliteVersion = info.sqliteVersion;
    const empty = !info.cards.length && !info.daily.length;
    const old = !info.meta.migrated_from && empty ? readLocalStorageState() : null;
    if (old && Object.keys(old.cards).length) {
      state = old;
      await dbc.call("replaceState", { ...stateToRows(old), settings: old.settings, clearReviews: false });
      migratedNote = `Moved ${Object.keys(old.cards).length} cards from the old browser storage into SQLite.`;
    } else applyRows(info);
    if (!info.meta.migrated_from) await dbc.call("meta", { key: "migrated_from", value: old ? "localStorage" : "none" });
    if (info.meta.wanikani_import_ms) wkImportMs = +info.meta.wanikani_import_ms;
    lastBackupMs = +info.meta.last_backup_ms || 0; lastBackupHow = info.meta.last_backup_method || "";
    dbReady = true; syncEl.textContent = savedLabel();
    await splitKanjiCards();
  } catch (e) {
    dbReady = false;
    dbError = String(e && e.message || e);
    if (/lock|access handle|NoModificationAllowed|InvalidState/i.test(dbError)) dbError = "The database is locked, probably because the app is open in another tab or window. Close the others and reload. " + dbError;
    state = readLocalStorageState() || freshState();
    buildContent(state.extraItems || []);
    await splitKanjiCards();
    syncEl.textContent = "Database unavailable";
    console.error(e);
  }
  if (navigator.storage && navigator.storage.persist) {
    try { persisted = (await navigator.storage.persisted()) || (await navigator.storage.persist()); } catch (e) {}
  }
  await loadBackupHandle();
  applyFont();
  render();
  if (dbReady) prepareExport();
}

/* ------------------------------ backups ------------------------------ */
// Browsers can't silently write a file on iOS, so backups work in three layers:
//  1. Daily snapshots inside the app's own storage (automatic; protects against mistakes, not device loss).
//  2. A reminder banner every N days with a one-tap "Back up now" (share sheet → Save to Files / iCloud Drive on iPhone).
//  3. On Chrome/Edge desktop, a chosen backup file that is overwritten automatically after you study.
let exportCache = null, exportCacheSeq = -1, exportPromise = null;
function prepareExport() {
  if (!dbReady) return Promise.resolve(null);
  if (exportCache && exportCacheSeq === changeSeq) return Promise.resolve(exportCache);
  const seqAtStart = changeSeq;
  exportPromise = dbc.call("exportDb").then(bytes => { exportCache = bytes; exportCacheSeq = seqAtStart; return bytes; });
  return exportPromise;
}
const backupName = () => `kanji-srs-${new Date().toLocaleDateString("sv-SE")}.sqlite3`;
async function markBackedUp(how) {
  lastBackupMs = Date.now(); lastBackupHow = how;
  await dbc.call("meta", { key: "last_backup_ms", value: lastBackupMs });
  await dbc.call("meta", { key: "last_backup_method", value: how });
}

// Minimal IndexedDB key/value store, only used to remember the desktop backup file handle.
const kv = {
  open() { return new Promise((res, rej) => { const r = indexedDB.open("kanji-srs-kv", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k) { const db = await this.open(); return new Promise(res => { const r = db.transaction("kv").objectStore("kv").get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(undefined); }); },
  async set(k, v) { const db = await this.open(); return new Promise(res => { const t = db.transaction("kv", "readwrite"); v === undefined ? t.objectStore("kv").delete(k) : t.objectStore("kv").put(v, k); t.oncomplete = () => res(); t.onerror = () => res(); }); },
};
const canAutoFile = () => "showSaveFilePicker" in window;
let fileHandle = null, filePerm = "none";
async function loadBackupHandle() {
  if (!canAutoFile()) return;
  try { fileHandle = (await kv.get("backupHandle")) || null; filePerm = fileHandle ? await fileHandle.queryPermission({ mode: "readwrite" }) : "none"; } catch (e) { fileHandle = null; }
}
async function writeHandle(bytes) { const w = await fileHandle.createWritable(); await w.write(bytes); await w.close(); }
let autoTimer = null, autoSeq = -1;
function scheduleAutoBackup() { if (fileHandle) { clearTimeout(autoTimer); autoTimer = setTimeout(autoBackup, 20000); } }
async function autoBackup() {
  if (!dbReady || !fileHandle || autoSeq === changeSeq) return;
  try {
    filePerm = await fileHandle.queryPermission({ mode: "readwrite" });
    if (filePerm !== "granted") return;
    const seq = changeSeq; await writeHandle(await prepareExport()); autoSeq = seq; await markBackedUp("auto-file");
  } catch (e) { console.warn("auto backup failed", e); }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") autoBackup(); else if (dbReady) prepareExport(); });

// Called from a tap. Uses a pre-built export so iOS still treats the share as user-initiated.
async function backupNow() {
  if (!dbReady) return "No database to back up.";
  if (fileHandle) {
    try {
      filePerm = await fileHandle.requestPermission({ mode: "readwrite" });
      if (filePerm === "granted") { await writeHandle(await prepareExport()); autoSeq = changeSeq; await markBackedUp("auto-file"); return `Saved to ${fileHandle.name}.`; }
    } catch (e) { console.warn(e); }
  }
  const fresh = exportCache && exportCacheSeq === changeSeq;
  const bytes = fresh ? exportCache : await prepareExport();
  const file = new File([bytes], backupName(), { type: "application/x-sqlite3" });
  const mobile = matchMedia("(pointer: coarse)").matches;
  if (mobile && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: file.name }); await markBackedUp("share"); return "Backup shared. On iPhone pick “Save to Files” and choose iCloud Drive."; }
    catch (e) {
      if (e.name === "AbortError") return "Backup cancelled.";
      if (e.name === "NotAllowedError") return "The backup is ready now. Tap the button once more.";
    }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  await markBackedUp("download");

}
async function chooseBackupFile() {
  try {
    fileHandle = await window.showSaveFilePicker({ suggestedName: "kanji-srs-backup.sqlite3",
      types: [{ description: "SQLite database", accept: { "application/x-sqlite3": [".sqlite3", ".db"] } }] });
    await kv.set("backupHandle", fileHandle); filePerm = "granted";
    await writeHandle(await prepareExport()); autoSeq = changeSeq; await markBackedUp("auto-file");
    return `Backing up automatically to ${fileHandle.name}.`;
  } catch (e) { return e.name === "AbortError" ? "" : "Couldn't use that file: " + e.message; }
}
async function stopBackupFile() { fileHandle = null; filePerm = "none"; await kv.set("backupHandle", undefined); }

const backupEvery = () => state.settings.backupEveryDays ?? 3;
function backupDue() {
  const n = backupEvery();
  if (!dbReady || n <= 0 || !Object.keys(state.cards).length || sessionStorage.getItem("backup-snooze")) return false;
  if (fileHandle && filePerm === "granted") return false; // handled silently
  return Date.now() - lastBackupMs >= n * DAY;
}
function agoText(ms) {

  const d = Math.floor((Date.now() - ms) / DAY);
  return d <= 0 ? "today" : d === 1 ? "yesterday" : `${d} days ago`;
}
function backupBannerHtml() {
  if (dbError) return `<div class="panel banner"><div class="t">⚠️ ${esc(dbError)}<br><span class="hint">Your progress is going to browser storage for now.</span></div></div>`;
  if (fileHandle && filePerm !== "granted" && backupEvery() > 0 && Object.keys(state.cards).length)
    return `<div class="panel banner"><div class="t">Automatic backups to <b>${esc(fileHandle.name)}</b> are paused until you allow it again.</div><button class="btn primary" id="bk-now">Allow</button></div>`;
  if (!backupDue()) return migratedNote ? `<div class="panel banner"><div class="t">${esc(migratedNote)}</div></div>` : "";
  return `<div class="panel banner"><div class="t">💾 Last backup: <b>${agoText(lastBackupMs)}</b>. Save a copy of your database off this device.<div class="msg" id="bk-msg"></div></div>
    <button class="btn primary" id="bk-now">Back up now</button><button class="btn" id="bk-later">Later</button></div>`;
}
function wireBackupBanner() {
  const now = document.getElementById("bk-now"), later = document.getElementById("bk-later");
  if (now) now.onclick = async () => {
    now.disabled = true; const msg = await backupNow(); now.disabled = false;
    const el = document.getElementById("bk-msg"); if (el) el.textContent = msg;
    if (!backupDue()) setTimeout(() => { if (view === "home") renderHome(); }, 2500);
  };

function renderBackupPanel(el) {
  const fmtDay = id => /^\d+$/.test(id) ? dayDate(+id) : id.startsWith("pre-import-") ? "before import " + new Date(+id.slice(11)).toLocaleString()
    : id.startsWith("pre-split-") ? "before meaning/reading split " + new Date(+id.slice(10)).toLocaleString() : id;

    <p class="hint">${dbReady

  const msg = document.getElementById("bk-msg2"), say = t => { msg.textContent = t; };

/* ------------------------------ WaniKani import ------------------------------ */
// Reads the WaniKani app's local-cache.db on this device (nothing is uploaded), adds its
// kanji and vocabulary as study content, and turns each item's SRS stage into an SM-2 card.
// The cache has the current stage and answer totals per item, not a log of past reviews,
// so no rows are added to `reviews`.
const WK_STAGES = ["Lesson", "Apprentice 1", "Apprentice 2", "Apprentice 3", "Apprentice 4", "Guru 1", "Guru 2", "Master", "Enlightened", "Burned"];
const WK_STAGE_DAYS = [0, 1 / 6, 1 / 3, 1, 2, 7, 14, 30, 120];   // WaniKani's wait after reaching each stage
const WK_IVL = [0, 1, 1, 1, 2, 7, 14, 30, 120, 365];             // SM-2 interval (days) given to each stage
const hiraToKata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
let wkData = null, wkSpread = 30, wkImportMs = 0;

function wkContent(it) {
  const shown = it.meanings.filter(m => m.type === 1 || m.type === 2).map(m => m.text);
  const acceptM = [...it.meanings.filter(m => m.type === 3).map(m => m.text), ...it.synonyms];
  if (it.kind === "kanji") {
    const by = t => it.readings.filter(r => r.type === t).sort((a, b) => b.primary - a.primary).map(r => r.text.replace(/[^ぁ-ゖァ-ヺー]/g, "")).filter(Boolean);
    return { meaning: shown.join("; "), on: by(1).map(hiraToKata).join("、"), kun: by(2).join("、"), acceptM, acceptR: [], level: it.level };
  }
  const rs = it.readings.slice().sort((a, b) => b.primary - a.primary).map(r => r.text);
  return { r: rs[0] || "", m: shown.join("; "), acceptM, acceptR: rs.slice(1), level: it.level };
}
function wkEase(st) {
  const tot = st ? st.mc + st.mi + st.rc + st.ri : 0;
  if (!tot) return START_EASE;
  const pct = (st.mc + st.rc) / tot;                 // 95%+ correct keeps 250%; 70% gives 200%
  return Math.round(Math.min(START_EASE, Math.max(MIN_EASE, START_EASE - 2 * (0.95 - pct))) * 100) / 100;
}
// Build items + cards. Cards you have already studied in this app are left alone.
// Reviews that are overdue (WaniKani wanted them before today) are spread over `spreadDays`
// days, weakest first, so a long break doesn't land as one giant pile.
function planWaniKani(wk, spreadDays) {
  const now = Date.now(), td = today();
  const items = [], cards = [], overdue = [];
  const sum = { kanji: 0, word: 0, cards: 0, kept: 0, kana: 0, lessons: 0, overdue: 0, future: 0, coreK: 0, coreW: 0, stages: new Array(10).fill(0) };
  const builtK = new Set(KANJI.filter(k => k.src === "core").map(k => k.k)), builtW = new Set(WORDS.filter(w => w.src === "core").map(w => w.w));
  wk.items.forEach((it, i) => {
    const data = wkContent(it);
    if (it.kind === "word" && (!data.r || !/[一-鿿々]/.test(it.ch))) { sum.kana++; return; } // kana-only words: nothing to read
    items.push({ kind: it.kind, item: it.ch, source: "wanikani", sort: 100000 + i, data_json: JSON.stringify(data) });
    sum[it.kind]++;
    if (it.kind === "kanji" ? builtK.has(it.ch) : builtW.has(it.ch)) sum[it.kind === "kanji" ? "coreK" : "coreW"]++;
    const stage = it.stage || 0; sum.stages[stage]++;
    if (stage < 1) { sum.lessons++; return; }          // not started on WaniKani: stays a new card here
    // A WaniKani kanji gives both a meaning card and a reading card here.
    for (const deck of it.kind === "kanji" ? ["kanji", "readings"] : ["words", "wordread"]) {
    const id = cardId(deck, it.ch);
    const mine = state.cards[id];
    if (mine && mine.t !== "new") { sum.kept++; continue; }
    const st = it.stats;
    const card = { t: "review", s: 0, ivl: WK_IVL[stage], e: wkEase(st),
      r: st ? Math.max(st.mc + st.mi, st.rc + st.ri) : 1, l: st ? st.mi + st.ri : 0 };
    const last = stage === 9 ? it.burnedMs : it.availableMs ? it.availableMs - WK_STAGE_DAYS[stage] * DAY : null;
    if (last) card.last = Math.round(last);
    const due = stage === 9 ? (it.burnedMs || now) + WK_IVL[9] * DAY : it.availableMs || now;
    const acc = st && (st.mc + st.mi + st.rc + st.ri) ? (st.mc + st.rc) / (st.mc + st.mi + st.rc + st.ri) : 1;
    if (dayNum(due) <= td) overdue.push({ id, card, stage, acc });
    else { card.due = due; sum.future++; cards.push(cardToRow(id, card)); }
    }
  });
  overdue.sort((a, b) => a.stage - b.stage || a.acc - b.acc);
  const days = Math.max(1, spreadDays);
  overdue.forEach((o, i) => { o.card.due = dueAtDay(td + Math.floor(i * days / overdue.length)); cards.push(cardToRow(o.id, o.card)); });
  sum.overdue = overdue.length; sum.cards = cards.length;
  return { items, cards, sum };
}
function wkSummaryHtml(wk, plan) {
  const s = plan.sum, perDay = s.overdue ? Math.ceil(s.overdue / Math.max(1, wkSpread)) : 0;
  const stageRows = s.stages.map((n, i) => n ? `<span class="bk">${WK_STAGES[i]} <b>${n}</b></span>` : "").join(" ");
  return `<p class="hint">Found <b>${esc(wk.user.username || "a WaniKani account")}</b>${wk.user.level ? `, level ${wk.user.level}` : ""}:
      <b>${s.kanji}</b> kanji and <b>${s.word}</b> vocabulary (${s.coreK} of the kanji and ${s.coreW} of the words are already in the built-in list).
      ${wk.radicals || s.kana ? `Skipped: ${[wk.radicals ? `${wk.radicals} radicals (no radical deck here)` : "", s.kana ? `${s.kana} kana-only words` : ""].filter(Boolean).join(" and ")}.` : ""}</p>
    <div class="breakdown" style="justify-content:flex-start">${stageRows}</div>
    <p class="hint"><b>${s.cards}</b> cards get WaniKani's progress${s.kept ? `, <b>${s.kept}</b> you already study here keep their progress here` : ""}${s.lessons ? `, and <b>${s.lessons}</b> items you hadn't started become new cards` : ""}.
      Apprentice becomes a 1–2 day interval, Guru 7–14 days, Master 30, Enlightened 120, Burned 365. Ease comes from your WaniKani accuracy.</p>
    ${s.overdue ? `<div class="row"><label for="wk-spread"><b>${s.overdue}</b> reviews are overdue${s.future ? ` (${s.future} more come due later on WaniKani's schedule)` : ""}. Spread them over<br>
      <span class="hint">About ${perDay} a day, weakest items first. Anything you miss drops back to relearning.</span></label>
      <select id="wk-spread">${[[1, "Today"], [7, "1 week"], [14, "2 weeks"], [30, "30 days"], [60, "60 days"]].map(([v, t]) => `<option value="${v}" ${wkSpread === v ? "selected" : ""}>${t}</option>`).join("")}</select></div>` : ""}
    <div class="btnrow"><button class="btn primary" id="wk-go">Import ${s.kanji + s.word} items</button><button class="btn" id="wk-cancel">Cancel</button></div>
    <p class="hint">A snapshot is taken first, so you can undo this under “Snapshots on this device”.</p>`;
}
function renderWaniKaniPanel(el) {
  const last = wkImportMs;
  el.innerHTML = `<p class="hint">Pick the <code>local-cache.db</code> file from the WaniKani app. It's read on this device; nothing is uploaded.
      Kanji and vocabulary you studied there are added here with their SRS stage turned into Anki-style intervals.${last ? ` Last import: ${esc(new Date(last).toLocaleString())}.` : ""}</p>
    <div class="btnrow"><button class="btn" id="wk-pick" ${dbReady ? "" : "disabled"}>Choose local-cache.db…</button><input type="file" id="wk-file" hidden></div>
    <div id="wk-out"></div><div class="msg" id="wk-msg"></div>`;
  const out = document.getElementById("wk-out"), msg = document.getElementById("wk-msg"), fileIn = document.getElementById("wk-file");
  document.getElementById("wk-pick").onclick = () => fileIn.click();
  const show = () => {
    const plan = planWaniKani(wkData, wkSpread);
    out.innerHTML = wkSummaryHtml(wkData, plan);
    const sel = document.getElementById("wk-spread"); if (sel) sel.onchange = e => { wkSpread = +e.target.value; show(); };
    document.getElementById("wk-cancel").onclick = () => { wkData = null; out.innerHTML = ""; };
    document.getElementById("wk-go").onclick = async e => {
      e.target.disabled = true; msg.textContent = "Importing…";
      try {
        const fresh = planWaniKani(wkData, wkSpread);
        const data = await dbc.call("importItems", { items: fresh.items, cards: fresh.cards,
          meta: { wanikani_import_ms: Date.now(), wanikani_user: wkData.user.username || "" } });
        applyRows(data); wkImportMs = +data.meta.wanikani_import_ms; changeSeq++; persistLocal(); scheduleAutoBackup();
        wkData = null; out.innerHTML = "";
        msg.textContent = `Imported ${fresh.items.length} items and ${fresh.cards.length} cards.`;
        setTimeout(() => go("home"), 1500);
      } catch (err) { msg.textContent = "Import failed: " + (err.message || err); e.target.disabled = false; }
    };
  };
  fileIn.onchange = async () => {
    const f = fileIn.files[0]; fileIn.value = ""; if (!f) return;
    msg.textContent = "Reading…"; out.innerHTML = "";
    try {
      const bytes = new Uint8Array(await f.arrayBuffer());
      wkData = await dbc.call("readWaniKani", { bytes }, [bytes.buffer]);
      if (!wkData.items.length) throw new Error("No kanji or vocabulary with progress found in that file.");
      msg.textContent = ""; show();
    } catch (err) { wkData = null; msg.textContent = String(err.message || err); }
  };
}

function speak(text) {
  try {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = "ja-JP"; u.rate = 0.9;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith("ja")); if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// Romaji → hiragana, so readings can be typed on any keyboard (a Japanese IME works too).
const ROMA = (() => {
  const t = { a: "あ", i: "い", u: "う", e: "え", o: "お", "-": "ー" };
  const rows = { k: "かきくけこ", s: "さしすせそ", t: "たちつてと", n: "なにぬねの", h: "はひふへほ", m: "まみむめも",
    r: "らりるれろ", g: "がぎぐげご", z: "ざじずぜぞ", d: "だぢづでど", b: "ばびぶべぼ", p: "ぱぴぷぺぽ" };
  for (const [c, ks] of Object.entries(rows)) [..."aiueo"].forEach((v, j) => t[c + v] = ks[j]);
  Object.assign(t, { ya: "や", yu: "ゆ", yo: "よ", ye: "いぇ", wa: "わ", wo: "を", wi: "うぃ", we: "うぇ",
    shi: "し", chi: "ち", tsu: "つ", fu: "ふ", ji: "じ", si: "し", ti: "ち", tu: "つ", hu: "ふ", zi: "じ", di: "ぢ", du: "づ",
    sha: "しゃ", shu: "しゅ", sho: "しょ", she: "しぇ", cha: "ちゃ", chu: "ちゅ", cho: "ちょ", che: "ちぇ",
    ja: "じゃ", ju: "じゅ", jo: "じょ", je: "じぇ", fa: "ふぁ", fi: "ふぃ", fe: "ふぇ", fo: "ふぉ", vu: "ゔ",
    xa: "ぁ", xi: "ぃ", xu: "ぅ", xe: "ぇ", xo: "ぉ", la: "ぁ", li: "ぃ", lu: "ぅ", le: "ぇ", lo: "ぉ",
    xya: "ゃ", xyu: "ゅ", xyo: "ょ", lya: "ゃ", lyu: "ゅ", lyo: "ょ", xtu: "っ", ltu: "っ", xtsu: "っ" });
  const yo = { ya: "ゃ", yu: "ゅ", yo: "ょ" };
  for (const [c, i] of Object.entries({ k: "き", g: "ぎ", n: "に", h: "ひ", m: "み", r: "り", b: "び", p: "ぴ", s: "し", z: "じ", t: "ち", d: "ぢ", j: "じ", c: "ち" }))
    for (const [y, small] of Object.entries(yo)) t[c + y] = i + small;
  return t;
})();
const ROMA_PREFIX = new Set(Object.keys(ROMA).flatMap(k => [...k].map((_, i) => k.slice(0, i + 1))));
function toKana(str, final) {
  let out = "", i = 0; const s = str.toLowerCase();
  while (i < s.length) {
    const ch = s[i];
    if (!/[a-z'\-]/.test(ch)) { out += str[i]; i++; continue; }
    if (ch === "n") {
      const nx = s[i + 1];
      if (nx === undefined) { out += final ? "ん" : "n"; i++; continue; }
      if (nx === "'") { out += "ん"; i += 2; continue; }
      if (nx === "n") { out += "ん"; i += /[aiueoy]/.test(s[i + 2] || "") ? 1 : 2; continue; } // onnna/onnanoko → おんな
      if (!/[aiueoy]/.test(nx)) { out += "ん"; i++; continue; }
    }
    if (/[bcdfghjkmpqrstvwxyz]/.test(ch) && s[i + 1] === ch) { out += "っ"; i++; continue; }
    if (ch === "t" && s[i + 1] === "c" && s[i + 2] === "h") { out += "っ"; i++; continue; } // matcha
    let hit = 0;
    for (const L of [4, 3, 2, 1]) if (ROMA[s.slice(i, i + L)]) { hit = L; break; }
    if (hit) { out += ROMA[s.slice(i, i + hit)]; i += hit; continue; }
    if (!final && ROMA_PREFIX.has(s.slice(i))) { out += s.slice(i); break; } // still typing
    out += str[i]; i++;
  }
  return out;
}
const kataToHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const normKana = s => kataToHira(toKana(s.trim(), true)).replace(/[\s・.。、,]/g, "");
const isKana = s => /^[ぁ-ゖーー]+$/.test(s);

function kanjiReadings(k) {
  const out = new Set();
  (k.on || "").split("、").filter(Boolean).forEach(r => out.add(kataToHira(r)));
  (k.kun || "").split("、").filter(Boolean).forEach(r => {
    r = r.replace(/-/g, "");
    out.add(r.replace(/[()]/g, ""));          // ひと(つ) → ひとつ
    const stem = r.replace(/\(.*?\)/g, "");      // ひと(つ) → ひと (only when the stem is 2+ kana)
    if (stem.length >= 2 || !r.includes("(")) out.add(stem);
  });
  (k.acceptR || []).forEach(r => out.add(kataToHira(r)));
  out.delete("");
  return [...out];
}
function normMeaning(s) {
  return s.toLowerCase().replace(/[’']/g, "").replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim()
    .replace(/^(to|a|an|the) /, "");
}
function meaningAnswers(m) {
  const out = new Set();
  m.split(/[;,]/).map(x => x.trim()).filter(Boolean).forEach(x => {
    out.add(normMeaning(x.replace(/\(.*?\)/g, "")));  // "(my) father" → father
    out.add(normMeaning(x.replace(/[()]/g, "")));     // → my father
  });
  if (m.split(/[;,]/).length > 1) out.add(normMeaning(m.replace(/\(.*?\)/g, "")));
  out.delete("");
  return [...out];
}
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function checkMeaning(given, accepted) {
  const g = normMeaning(given); if (!g) return { ok: false };
  for (const a of accepted) {
    const tol = a.length <= 3 ? 0 : a.length <= 6 ? 1 : 2;
    if (lev(g, a) <= tol) return { ok: true, close: g !== a };
  }
  return { ok: false };
}
// Questions per card. Kanji cards ask one thing each (meaning card / reading card); word
// cards are split the same way (meaning / reading). Writing cards (meaning → write the kanji by hand) stay self-graded.
const wordOf = cur => isClassDeck(cur.deck) ? CMAP[cur.key] : WMAP[cur.key]; // words, wordread → WMAP
// Class words written with kanji get a separate reading card; kana-only ones have nothing to read.
const hasReadingCard = w => !!w.r && hasKanji(w.w);
// Which class decks a word has a card in: meaning always; reading and writing only when written with kanji.
const classDeckHas = (deck, w) => deck === "class" || (deck === "classread" ? hasReadingCard(w) : hasKanji(w.w));
const hasKanji = w => /[\u3400-\u9fff\uf900-\ufaff々]/.test(w);
function questionsFor(cur) {
  if (!state.settings.typeMode || cur.deck === "recall" || cur.deck === "classwrite") return []; // writing cards are self-graded
  if (cur.deck === "kanji") {
    const k = KMAP[cur.key];
    return [{ kind: "meaning", accept: withExtra(meaningAnswers(k.meaning), k.acceptM), show: k.meaning }];
  }
  if (cur.deck === "readings") {
    const k = KMAP[cur.key];
    return [{ kind: "reading", accept: kanjiReadings(k), show: [k.on, k.kun].filter(Boolean).join(" / "), any: true }];
  }
  const w = wordOf(cur), qs = [];
  // Words and class words: the meaning card (words/class) and the reading card (wordread/classread) each ask one thing.
  if ((cur.deck === "wordread" || cur.deck === "classread") && w.r && hasKanji(w.w)) qs.push({ kind: "reading", accept: [kataToHira(w.r), ...(w.acceptR || []).map(kataToHira)].map(r => r.replace(/[〜～~]/g, "")), show: [w.r, ...(w.acceptR || [])].join("、") });
  if ((cur.deck === "words" || cur.deck === "class") && w.m) qs.push({ kind: "meaning", accept: withExtra(meaningAnswers(w.m), w.acceptM), show: w.m });
  return qs;
}
// Extra accepted meanings (WaniKani alternatives and your own synonyms).
const withExtra = (list, extra) => [...new Set([...list, ...(extra || []).flatMap(meaningAnswers)])];

function startSession(decks, scope = null) { session = { decks, cur: null, shown: false, undo: [], done: 0, right: 0, typed: 0 }; classScope = scope; lastShown = null; recentSibs = []; view = "study"; nextCard(); }
function setupCard() { const s = session; s.shown = false; s.qs = s.cur ? questionsFor(s.cur) : []; s.qi = 0; s.res = []; s.suggest = null; s.fb = null; s.warn = ""; s.typedVal = ""; s.hint = false; s.shownAt = Date.now(); }

function kanjiInfo(k, opts = {}) {
  const exs = k.examples.map(e => {

    return `<div class="ex"><span class="w">${esc(e.w)}</span><span class="r">${esc(e.r)}</span><span>${esc(e.m)}</span>${opts.lock && !unlocked ? '<span class="lock">locked</span>' : ""}</div>`;
  }).join("");
  return `<div class="meaning">${esc(k.meaning)}</div>
    <dl class="readings">${k.on ? `<dt>On'yomi</dt><dd>${esc(k.on)}</dd>` : ""}${k.kun ? `<dt>Kun'yomi</dt><dd>${esc(k.kun)}</dd>` : ""}</dl>
    <div class="examples">${exs}</div>`;
}
// The answer card shown right after a wrong answer: meanings, then readings. On'yomi are
// written in katakana and kun'yomi in hiragana (as the data stores them); word readings in hiragana.
// `misses` is the list of wrong answers [{ kind, given }].
function answerCard(cur, misses) {
  const missed = kind => misses.some(x => x.kind === kind);
  const sec = (kind, title, body) => `<div class="fbsec${missed(kind) ? " miss" : ""}"><h3>${title}</h3>${body}</div>`;
  const alts = list => list && list.length ? `<div class="alt">Also accepted: ${esc(list.join(", "))}</div>` : "";
  const join = s => (s || "").split("、").filter(Boolean).join("、 ");
  let m, r, extra = "";
  if (isWordDeck(cur.deck)) {
    const w = wordOf(cur);
    m = sec("meaning", "Meaning", `<div class="main">${esc(w.m)}</div>${alts(w.acceptM)}`);
    r = w.r && w.r !== w.w ? sec("reading", "Reading", `<div class="main" style="font-family:'Noto Sans JP',sans-serif">${esc([w.r, ...(w.acceptR || [])].join("、 "))}</div>`) : "";
    extra = breakdown(w);
  } else {
    const k = KMAP[cur.key];
    m = sec("meaning", "Meaning", `<div class="main">${esc(k.meaning)}</div>${alts(k.acceptM)}`);
    r = sec("reading", "Readings <span style=\"text-transform:none;letter-spacing:0\">· any one is accepted</span>", `<dl class="rd">
        <dt>On'yomi</dt><dd${k.on ? "" : ' class="none"'}>${k.on ? esc(join(k.on)) : "none"}</dd>
        <dt>Kun'yomi</dt><dd${k.kun ? "" : ' class="none"'}>${k.kun ? esc(join(k.kun)) : "none"}</dd></dl>`);
  }
  const label = x => x.kind === "meaning" ? "Meaning" : "Reading";
  const head = misses.length === 1
    ? `<div class="fbhead">✗ ${label(misses[0])}<span class="given">${misses[0].given !== "—" ? `You typed <b>${esc(misses[0].given)}</b>` : "Skipped"}</span></div>`
    : `<div class="fbhead">✗ ${misses.map(label).join(" and ")}</div>`;
  // Lead with what you missed, so that answer is the first thing you see.

function submitTyped(raw, gaveUp) {

    given = normKana(given);
    if (!isKana(given)) { s.warn = "That doesn't look like kana. Type it in romaji (e.g. mizu) or with a Japanese keyboard."; s.typedVal = raw; return render(); }
    r = { ok: q.accept.includes(given) };
  } else {
    if (/[぀-ヿ一-鿿]/.test(given)) { s.warn = "This one asks for the English meaning."; s.typedVal = ""; return render(); }
    r = checkMeaning(given, q.accept);
  }
  s.res.push({ kind: q.kind, given: gaveUp ? "—" : given, ok: r.ok, close: r.close, show: q.show });
  s.warn = ""; s.typedVal = ""; s.qi++;

  // question goes straight to the full answer below.

    if (autoGrading(s) && (ok || s.res[s.res.length - 1].ok)) { s.shown = true; return answer(s.suggest); }
    reveal();

}
// WaniKani style: grade from the typed answers, no grade buttons. All right → Good, any miss → Again.

  s.undo.push({ id: cur.id, prev: state.cards[cur.id] ? { ...state.cards[cur.id] } : null, daily: JSON.parse(JSON.stringify(state.daily)), hist: state.history[today()] || 0,
    typed: s.res.length ? 1 : 0, right: s.res.length && s.suggest === 3 && s.res.every(r => r.ok) ? 1 : 0 });

  state.cards[cur.id] = after;

    review: { ts_ms: now, study_day: today(), card_id: cur.id, deck: cur.deck, item: cur.key, grade: g,
      typed: typed ? 1 : 0, typed_correct: typed ? (s.res.every(r => r.ok) ? 1 : 0) : null,

  s.done = Math.max(0, s.done - 1); s.typed -= u.typed || 0; s.right -= u.right || 0;
  store.undoReview({ cardId: u.id, prevCard: u.prev ? cardToRow(u.id, u.prev) : null, ts: u.ts, daily: dailyRow() });

document.addEventListener("keydown", e => {
  if (view !== "study" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (document.getElementById("mbg")) return; // a popup is open, see openKanji()
  if (["INPUT", "TEXTAREA"].includes(document.activeElement && document.activeElement.tagName)) return;
  const s = session; if (!s) return;
  if (e.key === " " || e.key === "Enter") {
    e.preventDefault();

/* ============================== KANJI FONT ============================== */
// Fonts for kanji and words (the rest of the app stays in Noto Sans JP). All come from
// Google Fonts and are cached by the service worker, see warmFont() for offline use.
const FONTS = {
  klee:    { name: "Klee One",        q: "Klee+One:wght@400;600",        w: 600, label: "Klee One", note: "textbook handwriting" },
  zenmaru: { name: "Zen Maru Gothic", q: "Zen+Maru+Gothic:wght@500;700", w: 500, label: "Zen Maru Gothic", note: "rounded" },
  sans:    { name: "Noto Sans JP",    q: "Noto+Sans+JP:wght@400;500;700", w: 500, label: "Noto Sans JP", note: "clean gothic" },
  serif:   { name: "Noto Serif JP",   q: "Noto+Serif+JP:wght@500;700",   w: 500, label: "Noto Serif JP", note: "print mincho (old)" },
};
const fontCss = f => `https://fonts.googleapis.com/css2?family=${f.q}&display=swap`;
function applyFont() {
  const f = FONTS[state.settings.jpFont] || FONTS.klee;
  const link = document.getElementById("jpfont");
  if (link.getAttribute("href") !== fontCss(f)) link.href = fontCss(f);
  document.documentElement.style.setProperty("--jp", `"${f.name}","Noto Sans JP",sans-serif`);
  document.documentElement.style.setProperty("--jpw", f.w);
  warmFont(f);
}
// Japanese web fonts come in ~100 slices by character range and a browser only downloads
// the slices for characters it has drawn. To make the font work offline for every card,
// ask for all characters in the app's content once (the service worker caches each slice).
// Redone when the content grows, e.g. after a WaniKani import or a new class list.
function warmFont(f) {
  if (!document.fonts || !navigator.onLine) return;
  const chars = new Set("ぁあぃいぅうぇえぉおかがきぎくぐけげこごさざしじすずせぜそぞただちぢっつづてでとどなにぬねのはばぱひびぴふぶぷへべぺほぼぽまみむめもゃやゅゆょよらりるれろゎわをんゔァアィイゥウェエォオカガキギクグケゲコゴサザシジスズセゼソゾタダチヂッツヅテデトドナニヌネノハバパヒビピフブプヘベペホボポマミムメモャヤュユョヨラリルレロワヲンヴー・、。々〜");
  for (const k of KANJI) chars.add(k.k);
  for (const w of [...WORDS, ...CLASS]) for (const c of w.w) chars.add(c);
  const key = `kanji-srs-font:${f.name}:${chars.size}`;
  try { if (localStorage.getItem(key)) return; } catch (e) {}
  const text = [...chars].join("");
  const run = () => Promise.all([document.fonts.load(`${f.w} 40px "${f.name}"`, text), document.fonts.load(`400 40px "Noto Sans JP"`, text)])
    .then(() => { try { localStorage.setItem(key, "1"); } catch (e) {} }).catch(() => {});
  // The stylesheet has to be in before its @font-face rules exist.
  const link = document.getElementById("jpfont");
  const later = () => (window.requestIdleCallback || setTimeout)(run, { timeout: 4000 });
  if (link.sheet) later(); else link.addEventListener("load", later, { once: true });
}

/* ============================== CLASS WORDS ============================== */
// Paste the vocabulary list from class, one word per line. Accepted shapes (any order of
// the Japanese parts, any separator, columns pasted from a spreadsheet work too):
//   食べる たべる to eat · 毎日 - まいにち - every day · 学校（がっこう）school · ありがとう = thank you
// The Japanese part with kanji is the word and a kana-only part its reading; whatever is
// left is the English meaning. A word without reading or meaning borrows them from the
// app's own vocabulary when it knows the word.
const JP_RUN = /[\u3005\u3040-\u30ff\u3400-\u9fff\uf900-\ufaff\uff66-\uff9f〜～]+/g;
function parseClassList(text) {
  const words = [], problems = [], seen = new Set();
  for (let line of text.split(/\r?\n/)) {
    const raw = line.trim(); if (!raw) continue;
    line = raw.replace(/^\s*(?:\d+\s*[.)．、:]|[-*•・])\s*/, "");      // list numbering / bullets
    const runs = (line.match(JP_RUN) || []).map(r => r.replace(/^・+|・+$/g, "")).filter(r => r.replace(/[〜～ー・]/g, ""));
    if (!runs.length) { if (/[a-z]/i.test(line) && !/^(word|japanese|vocab|kanji|reading|meaning|english)/i.test(line)) problems.push(`No Japanese in “${raw}”`); continue; }
    const kanjiRun = runs.find(hasKanji);
    const w = kanjiRun || runs[0];
    const kana = runs.filter(r => r !== w && !hasKanji(r));
    let r = kanjiRun ? (kana[0] || "") : w;
    let m = line.replace(JP_RUN, " ").replace(/[（(]\s*[)）]|[「」【】『』]/g, " ")
      .replace(/^[\s\-–—=:：|,，、;；/\t]+|[\s\-–—=:：|,，、;；/\t]+$/g, "").replace(/\s*\t\s*/g, "; ").replace(/\s+/g, " ").trim();
    // A romaji column (食べる	たべる	taberu	to eat) is not part of the meaning: drop the first
    // one to three words of the meaning when, read as romaji, they spell the word's kana.
    const kanaOf = x => kataToHira(x || "").replace(/ー/g, "");
    const parts = m.match(/[^\s;]+[\s;]*/g) || [];
    for (let n = Math.min(3, parts.length - 1); n >= 1; n--) {
      const head = parts.slice(0, n).join(""), key = head.replace(/[\s;'\-]/g, "").toLowerCase();
      if (/^[a-z]+$/.test(key) && [r, w].some(x => x && kanaOf(x) === toKana(key, true).replace(/ー/g, ""))) { m = m.slice(head.length).trim(); break; }
    }
    const known = WMAP[w] || CMAP[w];
    if (known) { if (!r) r = known.r; if (!m) m = known.m; }
    if (!m) { problems.push(`No English meaning for ${w}`); continue; }
    if (seen.has(w)) continue; seen.add(w);
    words.push({ w, r: kataToHira(r) === kataToHira(w) && !hasKanji(w) ? "" : r, m, noReading: hasKanji(w) && !r });
  }
  return { words, problems };
}
const classLists = () => { const m = new Map(); for (const w of CLASS) m.set(w.list, (m.get(w.list) || 0) + 1); return [...m]; };
function classListStats(list) {
  const now = Date.now(), td = today(); let fresh = 0, due = 0, learned = 0;
  for (const w of CLASS) if (w.list === list) {
    for (const deck of CLASS_DECKS) {
      if (!classDeckHas(deck, w)) continue;
      const c = getCard(cardId(deck, w.w));
      if (c.t === "new") fresh++; else { learned++; if (c.t !== "review" ? c.due <= now + 20 * MIN : dayNum(c.due) <= td) due++; }
    }
  }
  return { fresh, due, learned };
}
let classDraft = null, classEdit = null;
// Fix a list's readings and meanings in place. Card progress is kept: cards are keyed by the word.
function classEditor(list) {
  const words = CLASS.filter(w => w.list === list);
  return `<div class="preview" id="cl-editor">
    <p class="hint" style="margin:0 0 6px">Fix any reading or meaning, then save. Your progress on these words is kept.</p>
    <table class="ctable"><tr><th>Word</th><th>Reading</th><th>Meaning</th></tr>
    ${words.map((w, i) => `<tr><td class="jw">${esc(w.w)}</td><td><input data-i="${i}" data-f="r" value="${esc(w.r)}" lang="ja" autocapitalize="off" autocorrect="off" spellcheck="false"></td>
      <td><input data-i="${i}" data-f="m" value="${esc(w.m)}" autocapitalize="off"></td></tr>`).join("")}</table>
    <div class="btnrow" style="margin-top:10px"><button class="btn primary" id="cl-save">Save changes</button><button class="btn" id="cl-close">Close</button></div>
  </div>`;
}
function wireClassEditor(msg) {
  const box = document.getElementById("cl-editor"); if (!box) return;
  const words = CLASS.filter(w => w.list === classEdit);
  box.querySelectorAll('input[data-f="r"]').forEach(inp => inp.addEventListener("input", () => {
    if (/[a-zA-Z\-]/.test(inp.value)) { const v = toKana(inp.value, false); if (v !== inp.value) inp.value = v; }
  }));
  document.getElementById("cl-close").onclick = () => { classEdit = null; render(); };
  document.getElementById("cl-save").onclick = async e => {
    const val = (i, f) => box.querySelector(`input[data-i="${i}"][data-f="${f}"]`).value.trim();
    const rows = [], bad = [];
    words.forEach((w, i) => {
      const r = toKana(val(i, "r"), true), m = val(i, "m");
      if (!m) { bad.push(w.w); return; }
      if (r === w.r && m === w.m) return;
      rows.push({ kind: "class", item: w.w, source: "class", sort: w.sort, data_json: JSON.stringify({ r, m, list: w.list }) });
    });
    if (bad.length) { msg.textContent = `Every word needs a meaning: ${bad.join("、")}`; return; }
    if (!rows.length) { classEdit = null; render(); return; }
    e.target.disabled = true;
    try {
      await saveClassItems(dbReady ? dbc.call("putItems", { items: rows }) : null,
        list => list.map(r => rows.find(x => x.kind === r.kind && x.item === r.item) || r));
    } catch (err) { msg.textContent = "Couldn't save: " + err.message; e.target.disabled = false; return; }
    classEdit = null; render();
    document.getElementById("cl-msg").textContent = `Saved ${rows.length} change${rows.length === 1 ? "" : "s"}.`;
  };
}
function renderClass() {
  const lists = classLists();
  const defName = `Class ${new Date().toLocaleDateString(undefined, { month: "short", day: "numeric" })}`;
  const listRows = lists.map(([name, n]) => {
    const st = classListStats(name);
    const noRead = CLASS.filter(w => w.list === name && hasKanji(w.w) && !w.r).length;
    return `<div class="deck clist">
      <div><div class="name">${esc(name)}</div><div class="desc">${n} words · cards: ${st.learned} started, ${st.due} due, ${st.fresh} new${noRead ? ` · <span class="warnc">${noRead} with kanji have no reading yet, tap Edit to add it</span>` : ""}</div></div>
      <button class="btn primary" data-study="${esc(name)}">Practice</button>
      <button class="btn" data-edit="${esc(name)}">Edit</button>
      <button class="btn" data-del="${esc(name)}">Remove</button>
    </div>${classEdit === name ? classEditor(name) : ""}`;
  }).join("");
  const draft = classDraft ? `<div class="preview">
      <p class="hint" style="margin:0 0 6px"><b>${classDraft.words.length}</b> word${classDraft.words.length === 1 ? "" : "s"} ready to add to <b>${esc(classDraft.list)}</b>. Check them, then add.</p>
      <table class="ctable"><tr><th>Word</th><th>Reading</th><th>Meaning</th></tr>
      ${classDraft.words.map(w => `<tr><td class="jw">${esc(w.w)}</td><td>${w.noReading ? '<span class="warnc">none, meaning only</span>' : esc(w.r || "—")}</td><td>${esc(w.m)}${CMAP[w.w] ? ' <span class="hint">(updates)</span>' : ""}</td></tr>`).join("")}</table>
      ${classDraft.problems.length ? `<p class="warnc" style="margin:8px 0 0">Skipped ${classDraft.problems.length} line${classDraft.problems.length === 1 ? "" : "s"}: ${esc(classDraft.problems.slice(0, 8).join(" · "))}${classDraft.problems.length > 8 ? " …" : ""}</p>` : ""}
      <div class="btnrow" style="margin-top:10px"><button class="btn primary" id="cl-add" ${classDraft.words.length ? "" : "disabled"}>Add ${classDraft.words.length} words</button><button class="btn" id="cl-cancel">Cancel</button></div>
    </div>` : "";
  main.innerHTML = `<div class="panel">
    <h2 style="margin-top:0">Class words</h2>
    <p class="hint" style="margin-top:0">Paste the vocabulary list from your Japanese class, one word per line, like <code>食べる たべる to eat</code>, <code>毎日 - まいにち - every day</code> or columns copied from a spreadsheet. Class words are their own deck with their own schedule, so you can practice just them.</p>
    ${CLASS.length ? `<button class="btn primary big" id="cl-all" style="margin-top:4px">Practice all class words · <span>${CLASS.length} words</span></button>` : ""}
    <div class="decks">${listRows}</div>
    <h2>Add a list</h2>
    <div class="row" style="margin:0 0 8px"><label for="cl-name">List name</label><input id="cl-name" value="${esc(classDraft ? classDraft.list : defName)}" style="flex:1;max-width:260px"></div>
    <textarea id="cl-text" class="cl-text" placeholder="食べる　たべる　to eat&#10;飲む - のむ - to drink&#10;ありがとう = thank you">${esc(classDraft ? classDraft.text : "")}</textarea>
    <div class="btnrow"><button class="btn" id="cl-preview">Preview</button></div>
    <div class="msg" id="cl-msg"></div>
    ${draft}
  </div>`;
  const msg = document.getElementById("cl-msg");
  document.getElementById("cl-preview").onclick = () => {
    const text = document.getElementById("cl-text").value, list = document.getElementById("cl-name").value.trim() || defName;
    const p = parseClassList(text);
    if (!p.words.length && !p.problems.length) { msg.textContent = "Paste your word list first."; return; }
    classDraft = { ...p, text, list }; render();
  };
  const all = document.getElementById("cl-all"); if (all) all.onclick = () => startSession(CLASS_DECKS);
  main.querySelectorAll("[data-study]").forEach(b => b.onclick = () => startSession(CLASS_DECKS, b.dataset.study));
  main.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => { classEdit = classEdit === b.dataset.edit ? null : b.dataset.edit; render(); });
  if (classEdit) wireClassEditor(msg);
  main.querySelectorAll("[data-del]").forEach(b => {
    let armed = false;
    b.onclick = async () => {
      if (!armed) { armed = true; b.textContent = "Tap again to remove"; return; }
      const words = CLASS.filter(w => w.list === b.dataset.del).map(w => w.w);
      try { await saveClassItems(dbReady ? dbc.call("deleteItems", { kind: "class", items: words }) : null, list => list.filter(r => !(r.kind === "class" && words.includes(r.item)))); }
      catch (e) { msg.textContent = "Couldn't remove: " + e.message; return; }
      render();
    };
  });
  if (classDraft) {
    document.getElementById("cl-cancel").onclick = () => { classDraft = null; render(); };
    document.getElementById("cl-add").onclick = async e => {
      e.target.disabled = true;
      const base = Date.now();
      const rows = classDraft.words.map((w, i) => ({ kind: "class", item: w.w, source: "class", sort: base + i,
        data_json: JSON.stringify({ r: w.noReading ? "" : w.r, m: w.m, list: classDraft.list }) }));
      try {
        await saveClassItems(dbReady ? dbc.call("putItems", { items: rows }) : null,
          list => [...list.filter(r => !(r.kind === "class" && rows.some(x => x.item === r.item))), ...rows]);
      } catch (err) { msg.textContent = "Couldn't add: " + err.message; e.target.disabled = false; return; }
      const n = rows.length; classDraft = null; render();
      document.getElementById("cl-msg").textContent = `Added ${n} words. Tap Practice to start.`;
    };
  }
}
// Write class items to SQLite (p resolves to the reloaded data) or, without a database, to
// the local fallback copy kept in state.extraItems. `edit` updates that local copy.
async function saveClassItems(p, edit) {
  if (p) { const data = await p; buildContent(data.items); changeSeq++; scheduleAutoBackup(); }
  else { state.extraItems = edit(state.extraItems || []); buildContent(state.extraItems); persistLocal(); }
  applyFont();
}

function tileClass(c) { if (c.t === "new") return ""; if (c.t === "review") return c.ivl >= 21 ? "mature" : "young"; return "learn"; }
function renderBrowse() {
  const tiles = list => list.map(k => `<button class="tile ${tileClass(getCard(cardId("kanji", k.k)))}" data-k="${k.k}" title="${esc(k.meaning)}">${k.k}</button>`).join("");
  const core = KANJI.filter(k => k.src === "core"), wk = KANJI.filter(k => k.src === "wanikani");
  main.innerHTML = `<div class="panel">
    <b>${KANJI.length} kanji · ${WORDS.length} words</b>
    <div class="legend"><span><i style="background:var(--tile-new)"></i>Not started</span><span><i style="background:var(--tile-learn)"></i>Learning</span><span><i style="background:var(--tile-young)"></i>Young</span><span><i style="background:var(--tile-mature)"></i>Mature (21d+)</span></div>
    ${wk.length ? `<h2 style="margin-top:4px">JLPT N5 (built in)</h2>` : ""}
    <div class="grid">${tiles(core)}</div>
    ${wk.length ? `<h2>From WaniKani</h2><div class="grid">${tiles(wk)}</div>` : ""}</div>`;
  main.querySelectorAll("[data-k]").forEach(b => b.onclick = () => openKanji(b.dataset.k));
}
function cardLine(label, c) {
  if (c.t === "new") return `${label}: not started`;
  const next = c.t === "review" ? `next in ${fmtIvl(Math.max(0, c.due - Date.now()))}` : "learning";
  return `${label}: ${next}, ${c.r} reviews, ${c.l || 0} lapses, ease ${Math.round(c.e * 100)}%`;
}
// Kanji details popup, from the Kanji tab and from the kanji tiles shown while studying.
// On a phone, opening it closes the keyboard so the popup gets the whole screen; closing
// it puts the cursor back in the answer box (which brings the keyboard back).
function openKanji(ch) {
  const k = KMAP[ch]; if (!k) return;
  const root = document.getElementById("modal-root");
  const refocus = view === "study" ? document.getElementById("ans") : null; // the answer box, if a question is open
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  const exWords = new Set(k.examples.map(e => e.w));
  const cls = CLASS.filter(w => w.ks.includes(ch) && !exWords.has(w.w)).slice(0, 8);
  const more = WORDS.filter(w => w.ks.includes(ch) && !exWords.has(w.w) && !cls.some(c => c.w === w.w)).slice(0, 5);
  const wordRows = list => `<div class="examples">${list.map(w => `<div class="ex"><span class="w">${esc(w.w)}</span><span class="r">${esc(w.r || "")}</span><span>${esc(w.m || "")}</span></div>`).join("")}</div>`;
  root.innerHTML = `<div class="modal-bg" id="mbg"><div class="panel modal" role="dialog" aria-modal="true" aria-label="Kanji ${esc(ch)}">
    <button class="close" id="mclose" aria-label="Close">✕</button>
    <div class="kanji-big">${esc(k.k)}</div>${kanjiInfo(k, { lock: true })}
    ${k.acceptM && k.acceptM.length ? `<div class="alt">Also accepted: ${esc(k.acceptM.join(", "))}</div>` : ""}
    ${k.level ? `<div class="alt">WaniKani level ${esc(String(k.level))}</div>` : ""}
    ${cls.length ? `<h3>In your class words</h3>${wordRows(cls)}` : ""}
    ${more.length ? `<h3>More words</h3>${wordRows(more)}` : ""}
    <div class="cardstats">${cardLine("Meaning card", getCard(cardId("kanji", ch)))}<br>${cardLine("Reading card", getCard(cardId("readings", ch)))}<br>${cardLine("Writing card", getCard(cardId("recall", ch)))}</div>
    ${k.examples.length ? '<button class="btn" id="mspeak" style="margin-top:12px">🔊 Hear examples</button>' : ""}
  </div></div>`;
  const close = () => {
    root.innerHTML = ""; document.removeEventListener("keydown", onKey, true);
    if (refocus && refocus.isConnected) refocus.focus({ preventScroll: true });
  };
  const onKey = e => { if (e.key === "Escape" || e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); close(); } };
  document.addEventListener("keydown", onKey, true);
  document.getElementById("mclose").onclick = close;
  document.getElementById("mbg").onclick = e => { if (e.target.id === "mbg") close(); };
  const ms = document.getElementById("mspeak"); if (ms) ms.onclick = () => speak(k.examples.map(e => e.r).join("、"));
}
// Any kanji tile (data-kinfo) opens the popup. Keeping the tap from moving focus means the
// answer box is still focused when openKanji() looks, so it can be refocused on close.
document.addEventListener("pointerdown", e => { if (e.target.closest && e.target.closest("[data-kinfo]")) e.preventDefault(); });
document.addEventListener("click", e => { const t = e.target.closest && e.target.closest("[data-kinfo]"); if (t) { e.preventDefault(); openKanji(t.dataset.kinfo); } });

function renderSettings() {
  const np = state.settings.newPerDay;
  main.innerHTML = `<div class="panel">
    <h2 style="margin-top:0">New cards per day</h2>
    ${DECKS.map(d => `<div class="row"><label for="np-${d.id}">${d.name}<br><span class="hint">${d.desc}</span></label><input type="number" min="0" max="200" id="np-${d.id}" value="${np[d.id]}"></div>`).join("")}
    <div class="row"><label for="typemode">Type your answers<br><span class="hint">Kanji meaning and reading cards ask for that one answer, word cards ask for the reading and the meaning; the app checks them and grades for you. Turn off to flip and grade yourself, like Anki.</span></label><input type="checkbox" id="typemode" ${state.settings.typeMode ? "checked" : ""}></div>
    <div class="row"><label for="autograde">Grade automatically<br><span class="hint">Like WaniKani: right answers count as Good and go straight to the next card, misses count as Again. Turn off to see the answer and pick Again, Hard, Good or Easy yourself. Writing cards always use the buttons.</span></label><input type="checkbox" id="autograde" ${state.settings.autoGrade ? "checked" : ""}></div>
    <div class="row"><label for="autospeak">Speak the reading when the answer is shown</label><input type="checkbox" id="autospeak" ${state.settings.autoSpeak ? "checked" : ""}></div>
    <h2>Kanji font</h2>
    <p class="hint" style="margin:0">Used for kanji and words on the cards. Works offline once it has loaded.</p>
    <div class="fontpick">${Object.entries(FONTS).map(([id, f]) => `<button data-font="${id}" class="${(state.settings.jpFont || "klee") === id ? "on" : ""}">
      <span class="s" style="font-family:'${f.name}',sans-serif;font-weight:${f.w}">漢字書</span>${esc(f.label)}<br><small>${esc(f.note)}</small></button>`).join("")}</div>
    <h2>Scheduling</h2>
    <p class="hint">Anki defaults: learning steps 1m and 10m, graduating interval 1 day, easy interval 4 days, starting ease 250%, relearning step 10m, new day starts at 4 a.m.</p>
    <h2>Import from WaniKani</h2>
    <div id="wk-panel"></div>
    <h2>Backup</h2>
    <div id="backup-panel"></div>
    <h2>Reset</h2>
    <button class="btn" id="reset">Reset all progress</button>
    <div class="msg" id="resetmsg"></div>
  </div>`;
  DECKS.forEach(d => document.getElementById("np-" + d.id).onchange = e => {
    const v = Math.max(0, Math.min(200, parseInt(e.target.value, 10) || 0)); e.target.value = v;
    state.settings.newPerDay[d.id] = v; store.settings();
  });
  document.getElementById("typemode").onchange = e => { state.settings.typeMode = e.target.checked; store.settings(); };
  document.getElementById("autograde").onchange = e => { state.settings.autoGrade = e.target.checked; store.settings(); };
  document.getElementById("autospeak").onchange = e => { state.settings.autoSpeak = e.target.checked; store.settings(); };
  if (!document.getElementById("fontpreview")) { // just the three sample characters of each font
    const l = document.createElement("link"); l.id = "fontpreview"; l.rel = "stylesheet";
    l.href = `https://fonts.googleapis.com/css2?${Object.values(FONTS).map(f => "family=" + f.q).join("&")}&text=${encodeURIComponent("漢字書")}&display=swap`;
    document.head.appendChild(l);
  }
  main.querySelectorAll("[data-font]").forEach(b => b.onclick = () => { state.settings.jpFont = b.dataset.font; store.settings(); applyFont(); renderSettings(); });
  renderBackupPanel(document.getElementById("backup-panel"));
  renderWaniKaniPanel(document.getElementById("wk-panel"));
  let armed = false;
  document.getElementById("reset").onclick = e => {
    if (!armed) { armed = true; e.target.textContent = "Click again to erase everything"; document.getElementById("resetmsg").textContent = "This can't be undone. Save a backup first if you might want it."; return; }
    const keep = state.settings; state = freshState(); state.settings = keep; store.replaceState(true);
    e.target.textContent = "Reset all progress"; armed = false; document.getElementById("resetmsg").textContent = "Progress erased.";
  };
}

boot();
setInterval(() => { if (view === "home") renderHome(); }, 60000);
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  // Updates: the page runs from the offline cache, so a new version only arrives through a
  // new service worker. When one takes over, reload to show it right away (or, mid-study,
  // as soon as you're back on the deck list). Also check for updates whenever the app is
  // brought back to the front, since an installed iPhone app is rarely relaunched.
  const hadController = !!navigator.serviceWorker.controller;
  let updatePending = false;
  const applyUpdate = () => { if (updatePending && view !== "study") location.reload(); };
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController) return; // first install, nothing new to show
    updatePending = true; applyUpdate();
  });
  const origGo = go; go = v => { origGo(v); applyUpdate(); };
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(reg => {
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
  }).catch(() => {}));
}
</script>
